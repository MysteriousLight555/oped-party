name: Windows portable release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        default: v2.4.0

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - name: Check release version
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid release tag' }
          $version = (Get-Content -Raw -Encoding utf8 package.json | ConvertFrom-Json).version
          if ("v$version" -ne $env:RELEASE_TAG) { throw 'Tag and package version differ' }
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: node scripts/verify-party.mjs
      - run: node scripts/verify-sync.mjs
      - name: Install tunnel runtime
        shell: pwsh
        run: |
          $target = 'C:\Program Files (x86)\cloudflared'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Invoke-WebRequest 'https://github.com/cloudflare/cloudflared/releases/download/2026.9.1/cloudflared-windows-amd64.exe' -OutFile (Join-Path $target 'cloudflared.exe')
      - run: node scripts/build-portable.mjs
      - name: Upload to prepared draft
        shell: pwsh
        run: |
          $archive = "build/oped-party-$env:RELEASE_TAG-win64.zip"
          $checksum = "$archive.sha256"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          Write-Output "SHA256: $hash"
          "$hash  $([IO.Path]::GetFileName($archive))" | Set-Content -Encoding utf8 -LiteralPath $checksum
          gh release upload $env:RELEASE_TAG $archive $checksum --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
